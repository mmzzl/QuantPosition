version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: graphify-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: graphify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: graphify-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/config:/app/config:ro
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_FILE=config.docker.yaml
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: graphify-celery
    restart: unless-stopped
    volumes:
      - ./apps/api/config:/app/config:ro
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_FILE=config.docker.yaml
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_config.celery_app worker --loglevel=info

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: graphify-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongo_data:
